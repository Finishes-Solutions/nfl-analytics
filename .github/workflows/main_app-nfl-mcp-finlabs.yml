name: Build and deploy Node.js app to Azure Web App - app-nfl-mcp-finlabs

on:
  push:
    branches:
      - main
    paths:
      - 'mcp-server/**'
      - '.github/workflows/main_app-nfl-mcp-finlabs.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install, build, prune to production deps
        working-directory: mcp-server
        run: |
          npm install
          npm run build
          npm prune --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            mcp-server/dist
            mcp-server/node_modules
            mcp-server/package.json

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_14EA1C0932E34CD3A6326C5B4D33F1EE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9E90C2C0EE164458B49188BA742AA7B7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_262A6D6FB72C4ED59F048B0257AD1EA6 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-nfl-mcp-finlabs'
          slot-name: 'Production'
          package: .
